services:
  backend:
    build:
      context: .
    ports:
      - "8801:8801"
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/retake
      REDIS_URL: redis://redis:6379
    depends_on:
      - mongo
      - redis
    restart: unless-stopped

  mongo:
    image: mongo:8
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  mongo-data:
  redis-data:
